# NeMo Guardrails 설정: 박물관 안내 챗봇의 입력·출력 검사.
#
# 차단 대상(입력·출력 공통): 탈옥·프롬프트 인젝션, 개인정보, 욕설·혐오.
# 박물관과 무관한 질문은 차단하지 않는다. 짧게 답한 뒤 박물관 이야기로 잇는 것은
# 답변 생성 프롬프트(src/service/ui/chatbot.py)가 맡는다.
#
# 검사 순서: 정규식(로컬, 무료) → LLM 자기검사(유료).
# 정규식에 걸린 개인정보는 LLM 으로 보내지 않고 바로 차단된다.

models:
  # 가드레일 판정용 모델. 환경변수 GUARDRAILS_MODEL 이 있으면 그 값으로 바뀐다(src/guardrails/guard.py).
  # 자기검사는 temperature 0 으로 호출하므로 temperature 를 지원하는 모델이어야 한다.
  - type: main
    engine: openai
    model: gpt-6-luna

rails:
  config:
    regex_detection:
      # 숫자 앞뒤에 영문·숫자·URL 기호(/ = & ? . % -)가 붙어 있으면 매칭하지 않는다.
      # 박물관 데이터의 URL 파라미터(예: mId=0103010100)를 전화번호로 오탐하지 않기 위해서다.
      # 한글은 경계로 보지 않는다("번호는010-1234-5678" 도 잡는다).
      input:
        patterns:
          # 휴대폰 번호
          - '(?<![0-9A-Za-z_/=&?.%-])01[016789][-. ]?\d{3,4}[-. ]?\d{4}(?![0-9A-Za-z_%])'
          # 주민등록번호·외국인등록번호 (생년월일 6자리 + 성별 1~8)
          - '(?<![0-9A-Za-z_/=&?.%-])\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\s?-?\s?[1-8]\d{6}(?![0-9A-Za-z_%])'
          # 카드번호 (4자리씩 구분자 포함)
          - '(?<![0-9A-Za-z_/=&?.%-])\d{4}[- ]\d{4}[- ]\d{4}[- ]\d{4}(?![0-9A-Za-z_%])'
          # 이메일
          - '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+'
      output:
        patterns:
          - '(?<![0-9A-Za-z_/=&?.%-])01[016789][-. ]?\d{3,4}[-. ]?\d{4}(?![0-9A-Za-z_%])'
          - '(?<![0-9A-Za-z_/=&?.%-])\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\s?-?\s?[1-8]\d{6}(?![0-9A-Za-z_%])'
          - '(?<![0-9A-Za-z_/=&?.%-])\d{4}[- ]\d{4}[- ]\d{4}[- ]\d{4}(?![0-9A-Za-z_%])'
          - '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+'

  input:
    flows:
      - regex check input
      - self check input

  output:
    flows:
      - regex check output
      - self check output
